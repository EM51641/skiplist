[package]
name = "skiplist"
version = "0.1.0"
edition = "2024"

[lib]
name = "matching_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
rand = "0.10.1"
rstest = "0.26.1"
rust_decimal = "1.42.0"
rust_decimal_macros = "1.40.0"
tokio = { version = "1.52.3", features = ["sync", "rt", "macros"] }
